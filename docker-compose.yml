services:
  ollama:
    image: ollama/ollama:latest
    container_name: llama_ai
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "5m"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - juice_net

  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: ollama-local
    volumes:
      - ./ollama-local.yml:/juice-shop/config/ollama-local.yml:ro
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - juice_net

volumes:
  ollama_data:

networks:
  juice_net:
    driver: bridge
